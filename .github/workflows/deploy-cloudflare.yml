name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deployment at a time. A newer main push supersedes an in-flight one.
concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Verify source
        run: npm run verify

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Apply database migrations
        run: npm exec -- wrangler d1 migrations apply GRADEMAXXING_USAGE_DB --remote

      - name: Deploy Worker
        run: npm exec -- wrangler deploy
