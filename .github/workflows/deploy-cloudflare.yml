name: Deploy production to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deployment at a time. A newer main push supersedes an in-flight one.
concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy production Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://grademaxxing.app
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Verify source
        run: npm run verify

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      # This additive migration is safe to repeat and does not replay older migrations.
      - name: Ensure Max diagnostics schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler d1 execute grademaxxing-usage --remote --config wrangler.jsonc --file migrations/0007_max_diagnostics.sql

      - name: Configure Max provider secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAX_PROVIDER_SECRETS: ${{ secrets.MAX_PROVIDER_SECRETS }}
        run: |
          if [ -n "$MAX_PROVIDER_SECRETS" ]; then
            printf '%s' "$MAX_PROVIDER_SECRETS" | npm exec -- wrangler secret bulk --config wrangler.jsonc
          fi

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler deploy --config wrangler.jsonc
