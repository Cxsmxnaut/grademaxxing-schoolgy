name: Broken Page or Feature
description: Something isn't working
title: '[Bug]: '
labels: ['bug']
body:
  - type: input
    id: synergy-domain
    attributes:
      label: Synergy domain
      description: What domain does your district use to access StudentVUE?
      placeholder: ex. state-city-district.edupoint.com
    validations:
      required: false
  - type: dropdown
    id: issue-scope
    attributes:
      label: Issue scope
      description: What part of Grademaxxing is broken?
      options:
        - Whole site
        - A specific page
        - Part of a page/a specific feature
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: If this only occurs on a specific page or feature, say where and describe any error, blank state, or stuck loading state. Never upload a screenshot containing a name, student ID, grade, attendance record, message, document, or other school record.
      placeholder: What went wrong and how and where did it occur?
    validations:
      required: true
  - type: textarea
    id: error-messages
    attributes:
      label: Error messages
      description: If Grademaxxing shows an error screen, paste only non-sensitive error text. Never include a password, cookie, token, student ID, full name, portal URL containing identifiers, or school record. Include browser-console output only after removing all student and session data.
    validations:
      required: false
