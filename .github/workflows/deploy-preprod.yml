name: Deploy pre-production to Cloudflare

on:
  push:
    branches: [pre-prod]
  workflow_dispatch:

concurrency:
  group: cloudflare-pre-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy pre-production Worker
    if: github.ref == 'refs/heads/pre-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
      url: https://dev.grademaxxing.app
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Verify source
        run: npm run verify

      - name: Build Cloudflare Worker
        run: npm run build:cloudflare

      - name: Deploy pre-production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm exec -- wrangler deploy --config wrangler.preprod.jsonc

      - name: Verify pre-production health
        run: |
          node --input-type=module <<'JS'
          const hosts = [
            'grademaxxing-pre-prod.bhavith-lolakapuri.workers.dev',
            'dev.grademaxxing.app',
            'new.grademaxxing.app'
          ];
          for (const host of hosts) {
            const response = await fetch(`https://${host}/api/health`, {
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok || (await response.json()).status !== 'ok') {
              throw new Error(`Pre-production health check failed for ${host}`);
            }
            if (response.headers.get('server') !== 'cloudflare') {
              throw new Error(`Expected Cloudflare to serve ${host}`);
            }
            console.log(`${host}: healthy`);
          }
          JS

      - name: Install browser for public smoke tests
        run: npx playwright install --with-deps chromium

      - name: Verify deployed landing and login navigation
        env:
          GRADEMAXXING_URL: https://dev.grademaxxing.app
        run: npx playwright test tests/e2e/landing-login-transition.spec.ts
